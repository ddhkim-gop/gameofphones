<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams</title>
    <link rel="stylesheet" href="style.css?v=20260607">

    <style>
        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            background: #fff;
        }

        .player {
            padding: 6px 8px;
            margin-top: 6px;
            background: #f5f5f5;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }

        .player:hover {
            background: #e9e9e9;
        }

        /* modal */
        #player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        #player-modal .modal-content {
            background: white;
            padding: 16px;
            border-radius: 10px;
            width: 360px;
        }

        #close-modal {
            float: right;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="nav"></div>

<h1>Teams</h1>

<div id="teams-container">Loading...</div>

<!-- Modal -->
<div id="player-modal">
    <div class="modal-content">
        <span id="close-modal">✕</span>
        <div id="player-details"></div>
    </div>
</div>

<script src="data.js?v=20260607c"></script>
<script type="module" src="teams.js?v=20260608a"></script>

</body>
</html>
