name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:   # manual redeploy; auto_refresh pushes can't trigger this # edited-by: obi | 2026-08-04
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
