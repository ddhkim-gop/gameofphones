name: Auto-refresh transactions

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Sleeper players data
        uses: actions/cache@v4
        with:
          path: scripts/players_cache.json
          key: sleeper-players-${{ hashFiles('scripts/players_cache.json') }}
          restore-keys: |
            sleeper-players-

      - name: Refresh transactions and rosters
        id: refresh
        run: python3 scripts/refresh_transactions.py
        continue-on-error: true   # exit code 1 = no changes (not an error)

      - name: Commit and push if data changed
        id: commit
        if: steps.refresh.outcome == 'success' && steps.refresh.conclusion == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js scripts/players_cache.json *.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # [skip ci] stays: this push runs as GITHUB_TOKEN, which GitHub
            # refuses to let trigger workflows anyway. The deploy job below
            # handles Pages in-run instead. # edited-by: obi | 2026-08-04
            git commit -m "Auto-refresh: update transactions and rosters [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Deploy in-run rather than relying on deploy.yml: the push above cannot
  # trigger it. # edited-by: obi | 2026-08-04
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Must be `ref: main`, not the default: checkout would otherwise grab the
      # SHA that triggered this run, which predates the refresh job's own push,
      # and publish the pre-refresh tree. # edited-by: obi | 2026-08-04
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
